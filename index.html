<script>
let ROLE='admin';let USERNAME='Super Admin';let TTD={peminjam:'',penyerah:''};
function pilihRole(r,el){ROLE=r;document.querySelectorAll('.roleBtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');let m={admin:['admin','admin123'],gudang:['gudang','gudang123'],atasan:['atasan','atasan123']};document.getElementById('user').value=m[r][0];document.getElementById('pass').value=m[r][1]}
function isiLogin(u,p){document.getElementById('user').value=u;document.getElementById('pass').value=p;if(u==='admin')pilihRole('admin',document.getElementById('roleAdmin'));if(u==='gudang')pilihRole('gudang',document.getElementById('roleGudang'));if(u==='atasan')pilihRole('atasan',document.getElementById('roleAtasan'))}
function login(){let u=document.getElementById('user').value.trim().toLowerCase(),p=document.getElementById('pass').value.trim();let ok={admin:'admin123',gudang:'gudang123',atasan:'atasan123'};if(ok[u]&&ok[u]===p){ROLE=u;USERNAME=u==='admin'?'Super Admin':u==='gudang'?'Anak Gudang / Outbound':'Atasan';document.getElementById('loginPage').style.display='none';document.getElementById('appPage').style.display='block';document.getElementById('roleLabel').textContent=USERNAME;document.getElementById('namaUser').textContent=USERNAME+' ('+u+')';document.getElementById('deviceLabel').textContent=(window.innerWidth<800?'📱 HP':'💻 Komputer');setInterval(()=>{document.getElementById('jamNow').textContent=new Date().toLocaleString('id-ID')},1000);aturRole();initSig();render();alert('✅ Selamat datang di OPERASIONAL OUTBOUND, '+USERNAME+'!\n\n1 Barcode untuk semua barang: EATWELL-OUTBOUND-001')}else alert('❌ Salah! Coba: admin / admin123')}
function logout(){location.reload()}
function aturRole(){if(ROLE==='gudang'){showMenu('mScan',null);document.querySelectorAll('.side button').forEach(b=>{let t=b.textContent;if(t.includes('Scan')||t.includes('Pinjam')||t.includes('Retur'))b.style.display='block';else b.style.display='none'})}else if(ROLE==='atasan'){showMenu('mPinjam',null)}else showMenu('mMaster',null)}
function modePresentasi(){let el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen();document.body.classList.add('presentasi-mode');alert('🎬 MODE PRESENTASI AKTIF! Tekan ESC untuk keluar!')}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('presentasi-mode')});
function aturZoom(v){document.getElementById('labelZoom').textContent=v+'%';document.body.style.zoom=v+'%'}
function load(){return JSON.parse(localStorage.getItem('eatwell_v23_outbound')||'{"master":[],"pinjam":[],"returList":[],"riwayat":[]}')}
function save(d){localStorage.setItem('eatwell_v23_outbound',JSON.stringify(d))}
function dipinjamAktif(nama){let d=load();return d.pinjam.filter(p=>p.nama===nama&&p.status.includes('Dipinjam')).reduce((a,b)=>a+b.jumlah,0)}
function akhir(m){return (m.so||0)+(m.in||0)-(m.out||0)+(m.retur||0)-dipinjamAktif(m.nama)}
function minus(m){let v=(m.so||0)+(m.in||0)-(m.out||0)+(m.retur||0);return v<0?v:0}
function waktuNow(){let w=new Date();return w.toLocaleTimeString('id-ID')+' - '+w.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
function showMenu(id,btn){['mMaster','mIN','mOUT','mWeekly','mBulanan','mReport','mStatistik','mScan','mPinjam','mRetur','mAI'].forEach(x=>{let e=document.getElementById(x);if(e)e.style.display='none'});let t=document.getElementById(id);if(t)t.style.display='block';if(id==='mScan'||id==='mPinjam'){document.getElementById('mScan').style.display='block';document.getElementById('mPinjam').style.display='block'}document.querySelectorAll('.side button').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');render()}
// TANDA TANGAN - Coret di HP / Laptop!
function initSig(){['sigPeminjam','sigPenyerah'].forEach(id=>{let c=document.getElementById(id);if(!c)return;let ctx=c.getContext('2d');ctx.strokeStyle='#111';ctx.lineWidth=2;let draw=false;function pos(e){let r=c.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top}}c.onmousedown=e=>{draw=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onmousemove=e=>{if(!draw)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onmouseup=()=>draw=false;c.ontouchstart=e=>{e.preventDefault();draw=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.ontouchmove=e=>{e.preventDefault();if(!draw)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};c.ontouchend=()=>draw=false})}
function clearSig(id){let c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height);if(id==='sigPeminjam')TTD.peminjam='';else TTD.penyerah='';document.getElementById(id==='sigPeminjam'?'statusSigPeminjam':'statusSigPenyerah').textContent='Belum tanda tangan'}
function simpanSig(id){let c=document.getElementById(id);let data=c.toDataURL();if(id==='sigPeminjam'){TTD.peminjam=data;document.getElementById('statusSigPeminjam').textContent='✅ TTD Peminjam tersimpan!'}else{TTD.penyerah=data;document.getElementById('statusSigPenyerah').textContent='✅ TTD Penyerah tersimpan!'}alert('✅ Tanda tangan tersimpan!')}
function printBarcode(){let w=window.open('','','width=600,height=500');w.document.write(`<html><body style="text-align:center;font-family:Arial;padding:40px"><h1>OPERASIONAL OUTBOUND</h1><h2>1 BARCODE UNTUK SEMUA BARANG</h2><div style="font-size:60px;letter-spacing:5px;background:#fff;border:3px solid #000;padding:20px">||| || ||| || ||| || ||| ||</div><h1 style="letter-spacing:5px">EATWELL-OUTBOUND-001</h1><p>Tempel barcode ini di pintu gudang / meja outbound!<br>Anak Gudang / Outbound scan barcode ini untuk pinjam barang!</p><button onclick="window.print()">🖨️ Print Barcode Ini!</button></body></html>`)}
function importFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById('paste').value=r.result;pasteExcel()};r.readAsText(f)}
function parseBaris(txt){return txt.trim().split('\n').map(r=>r.split(/[\t|,;]/).map(s=>s.trim()))}
function pasteExcel(){let d=load();let rows=parseBaris(document.getElementById('paste').value);let c=0;rows.forEach(p=>{if(p.length>=2){let nama=(p[2]||p[0]||'').toUpperCase();if(!nama||nama.includes('ITEM'))return;let brand=p[0]||'CKDS',cat=p[1]||'DRY GOOD',uom=p[3]||'PCS';let so=parseInt(p[4]||0),inn=parseInt(p[5]||0),out=parseInt(p[6]||0),ret=parseInt(p[7]||0);let ex=d.master.find(m=>m.nama===nama&&m.brand===brand);if(ex){ex.so+=so;ex.in+=inn;ex.out+=out;ex.retur+=ret}else d.master.push({brand,cat,nama,uom,so,in:inn,out,retur:ret});c++}});save(d);render();alert('✅ '+c+' barang dari Excel / PDF masuk!')}
function pasteIN(){let d=load();parseBaris(document.getElementById('pasteIN').value).forEach(p=>{if(p.length>=2){let nm=p[0].trim().toUpperCase(),j=parseInt(p[2]||p[1]||0);let a=d.master.find(m=>m.nama===nm);if(a){a.in+=j;d.riwayat.push({tipe:'IN',nama:a.nama,jumlah:j,waktu:waktuNow()})}}});save(d);render();alert('✅ IN masuk!')}
function pasteOUT(){let d=load();parseBaris(document.getElementById('pasteOUT').value).forEach(p=>{if(p.length>=2){let nm=p[0].trim().toUpperCase(),j=parseInt(p[2]||p[1]||0);let a=d.master.find(m=>m.nama===nm);if(a){a.out+=j;d.riwayat.push({tipe:'OUT',nama:a.nama,jumlah:j,waktu:waktuNow()})}}});save(d);render();alert('✅ OUT masuk!')}
function pasteSO(type){let d=load();parseBaris(document.getElementById(type==='weekly'?'pasteWeekly':'pasteBulanan').value).forEach(p=>{if(p.length>=2){let nm=p[0].trim().toUpperCase();let a=d.master.find(m=>m.nama===nm);if(a)a.so=parseInt(p[2]||p[1]||0);else d.master.push({brand:'CKDS',cat:'DRY GOOD',nama:nm,uom:'PCS',so:parseInt(p[2]||p[1]||0),in:0,out:0,retur:0})}});save(d);render();alert('✅ SO masuk!')}
function pasteReturExcel(){let d=load();parseBaris(document.getElementById('pasteRetur').value).forEach(p=>{if(p.length>=2){let nm=p[0].trim().toUpperCase(),j=parseInt(p[2]||p[1]||0);let a=d.master.find(m=>m.nama===nm);if(a){a.retur+=j;d.returList.push({nama:a.nama,jumlah:j,dari:a.brand,ke:a.brand,siapa:'Anak Gudang',alasan:p[3]||'Retur',waktu:waktuNow()})}}});save(d);render();alert('✅ Retur masuk & balik jadi Stok!')}
function tambah(){let d=load();let nm=document.getElementById('nNama').value.trim().toUpperCase();if(!nm)return alert('Isi Item Name!');d.master.push({brand:document.getElementById('nBrand').value||'CKDS',cat:document.getElementById('nCat').value||'DRY GOOD',nama:nm,uom:document.getElementById('nUom').value||'PCS',so:parseInt(document.getElementById('nSO').value||0),in:parseInt(document.getElementById('nIN').value||0),out:parseInt(document.getElementById('nOUT').value||0),retur:0});save(d);render();alert('✅ '+nm+' ditambah!')}
function tambahContoh(){let d=load();if(d.master.length)return render();d.master=[{brand:'CKDS',cat:'CHEMICAL',nama:'FORCE MAX PLUS',uom:'JERIGEN 5 LTR',so:10,in:5,out:12,retur:0},{brand:'CKDS',cat:'CHEMICAL',nama:'GENERAL CLEANER PLUS',uom:'JERIGEN 5 LTR',so:20,in:10,out:8,retur:1},{brand:'CKDS',cat:'DRY GOOD',nama:'SUMBA BAWANG',uom:'KG',so:50,in:20,out:70,retur:2},{brand:'CKDS',cat:'FOOD',nama:'AYAM FILLET',uom:'KG',so:100,in:50,out:40,retur:5}];save(d);render();alert('✅ Contoh CKDS masuk!')}
function copyExcel(){let d=load();navigator.clipboard.writeText(d.master.map(m=>[m.brand,m.cat,m.nama,m.uom,m.so,m.in,m.out,m.retur,minus(m),akhir(m)].join('\t')).join('\n')).then(()=>alert('✅ Ke-copy!'))}
function exportExcel(){let d=load();let csv='BRAND,CATEGORY,ITEM NAME,UOM,SO,IN,OUT,RETUR,MINUS,SISA STOK\n'+d.master.map(m=>[m.brand,m.cat,m.nama,m.uom,m.so,m.in,m.out,m.retur,minus(m),akhir(m)].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='OPERASIONAL-OUTBOUND.csv';a.click()}
function inputIN(){let d=load();let nm=document.getElementById('inNama').value.trim().toUpperCase(),j=parseInt(document.getElementById('inJml').value||0);let a=d.master.find(m=>m.nama===nm||m.nama.includes(nm));if(!a||!j)return alert('Barang tidak ketemu!');a.in+=j;d.riwayat.push({tipe:'IN',nama:a.nama,jumlah:j,waktu:waktuNow()});save(d);render();alert('✅ IN '+a.nama+' +'+j)}
function inputOUT(){let d=load();let nm=document.getElementById('outNama').value.trim().toUpperCase(),j=parseInt(document.getElementById('outJml').value||0);let a=d.master.find(m=>m.nama===nm||m.nama.includes(nm));if(!a||!j)return alert('Barang tidak ketemu!');a.out+=j;d.riwayat.push({tipe:'OUT',nama:a.nama,jumlah:j,waktu:waktuNow()});save(d);render();alert('✅ OUT '+a.nama+' -'+j)}
function tambahRetur(){let d=load();let nm=document.getElementById('rNama').value.trim().toUpperCase(),j=parseInt(document.getElementById('rJumlah').value||0);let a=d.master.find(m=>m.nama===nm)||d.master.find(m=>m.nama.includes(nm));if(!a||!j)return alert('Barang tidak ketemu!');a.retur+=j;d.returList.push({nama:a.nama,jumlah:j,dari:document.getElementById('rDari').value||a.brand,ke:document.getElementById('rKe').value||a.brand,siapa:document.getElementById('rSiapa').value||'Anak Gudang',alasan:document.getElementById('rAlasan').value||'Tidak jadi dipakai',waktu:waktuNow()});save(d);render();alert('✅ RETUR '+a.nama+' +'+j+' BALIK JADI STOK!')}
function ajukanPinjam(){let d=load();let nm=(document.getElementById('pNama').value||document.getElementById('scanInput').value||'').trim().toUpperCase(),pe=document.getElementById('pPenyerah').value.trim()||'Gudang Utama',pm=document.getElementById('pPeminjam').value.trim()||'Anak Gudang',j=parseInt(document.getElementById('pJumlah').value||0);let dari=document.getElementById('pDari').value.trim()||'Gudang CKDS',ke=document.getElementById('pKe').value.trim()||'ta Wan';if(!nm||!j)return alert('Lengkapi Barang & Jumlah!');if(!pm||!pe)return alert('Isi Siapa Yang Pinjem & Yang Dipinjemin!');let aksi=document.getElementById('pAksi').value;let siapa=document.getElementById('pSiapa').value;let namaTtdPem=document.getElementById('namaTtdPeminjam').value||pm;let namaTtdPen=document.getElementById('namaTtdPenyerah').value||pe;if(aksi==='kembali'){let idx=d.pinjam.findIndex(p=>p.nama===nm&&p.status.includes('Dipinjam'));if(idx>=0){d.pinjam[idx].status='✅ Dikembalikan - Selesai - '+waktuNow();save(d);render();alert('✅ KEMBALI '+nm+' - Stok balik lagi!');return}alert('Tidak ada pinjam aktif untuk '+nm);return}if(aksi==='retur'){let a=d.master.find(m=>m.nama===nm)||d.master.find(m=>m.nama.includes(nm));if(a){a.retur+=j;d.returList.push({nama:a.nama,jumlah:j,dari,ke,siapa,alasan:'Retur dari Pinjam',waktu:waktuNow()});save(d);render();alert('✅ RETUR '+a.nama+' +'+j+' BALIK JADI STOK!');return}}d.pinjam.push({nama:nm,penyerah:pe,peminjam:pm,siapa:siapa,dari,ke,jumlah:j,merek:document.getElementById('pMerek').value||'-',perlu:document.getElementById('pPerlu').value||'-',waktu:waktuNow(),status:'🤝 Dipinjam - Belum Kembali - Menunggu Setuju Atasan',aksi:'pinjam',ttdPeminjam:TTD.peminjam,ttdPenyerah:TTD.penyerah,namaTtdPeminjam:namaTtdPem,namaTtdPenyerah:namaTtdPen,setujuAtasan:'⏳ Menunggu Setuju Atasan',ttdAtasan:''});d.riwayat.push({tipe:'PINJAM',nama:nm,jumlah:j,waktu:waktuNow()});save(d);render();alert('✅ PINJAM TERKIRIM!\n\nBarang: '+nm+'\nDari: '+dari+' → Ke: '+ke+'\nSiapa: '+pm+' ('+siapa+')\nPenyerah: '+pe+'\n\nTTD Peminjam & Penyerah sudah tersimpan!\nMenunggu Setuju Atasan!')}
function setuju(i){let d=load();let nama=prompt('Nama Atasan Yang Setuju:','Atasan')||'Atasan';let ttd=confirm('Atasan setuju & tanda tangan? Klik OK untuk Setuju + TTD Atasan!');d.pinjam[i].status='✅ Disetujui - Surat Jalan Aktif';d.pinjam[i].setujuAtasan='✅ DISETUJUI oleh '+nama+' - '+waktuNow();d.pinjam[i].ttdAtasan='✅ TTD Atasan: '+nama;save(d);render();alert('✅ Disetujui oleh '+nama+'!')}
function tolak(i){let d=load();let a=prompt('Alasan Tolak:','Tidak disetujui')||'Tidak disetujui';d.pinjam[i].status='❌ Ditolak: '+a;d.pinjam[i].setujuAtasan='❌ DITOLAK: '+a;save(d);render()}
function kembaliPinjam(i){let d=load();d.pinjam[i].status='✅ Dikembalikan - Selesai - '+waktuNow();save(d);render();alert('✅ Dikembalikan!')}
function suratJalan(i){let d=load();let p=d.pinjam[i];let w=window.open('','','width=750,height=900');w.document.write(`<html><head><title>Surat Jalan - OPERASIONAL OUTBOUND</title><style>body{font-family:Arial;padding:30px}.box{border:2px solid #000;padding:16px}.sig{display:flex;justify-content:space-between;margin-top:30px;text-align:center}.sig div{border-top:1px solid #000;width:30%;padding-top:6px}.sig img{width:100%;max-height:60px}</style></head><body><h1 style="text-align:center">📋 SURAT JALAN - OPERASIONAL OUTBOUND</h1><p style="text-align:center">EATWELL - 1 Barcode Untuk Semua Barang</p><div class="box"><p><b>Barang:</b> ${p.nama} - ${p.merek}</p><p><b>Dari Mana:</b> ${p.dari}</p><p><b>Ke Mana:</b> ${p.ke}</p><p><b>Jumlah:</b> ${p.jumlah}</p><p><b>Keperluan:</b> ${p.perlu}</p><p><b>Waktu:</b> ${p.waktu}</p><p><b>Yang Pinjem:</b> ${p.peminjam} (${p.siapa})</p><p><b>Yang Dipinjemin / Penyerah:</b> ${p.penyerah}</p><p><b>Setuju Atasan:</b> ${p.setujuAtasan}</p><p><b>Status:</b> ${p.status}</p></div><div class="sig"><div>${p.ttdPeminjam?`<img src="${p.ttdPeminjam}">`:''}<br><b>Yang Minjem</b><br>${p.namaTtdPeminjam||p.peminjam}</div><div>${p.ttdPenyerah?`<img src="${p.ttdPenyerah}">`:''}<br><b>Yang Dipinjemin</b><br>${p.namaTtdPenyerah||p.penyerah}</div><div><br><b>Setuju Atasan</b><br>${p.setujuAtasan||'___________'}</div></div><br><button onclick="window.print()">🖨️ Print / PDF Surat Jalan</button></body></html>`)}
async function startScan(){let v=document.getElementById('vid');v.style.display='block';document.getElementById('scanStatus').textContent='📷 Kamera aktif... Scan 1 barcode EATWELL-OUTBOUND-001! Barcode apa aja tetap bisa karena 1 barcode untuk semua barang!';try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();if('BarcodeDetector' in window){let detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','upc_a','qr_code']});let loop=async()=>{try{let codes=await detector.detect(v);if(codes.length){let kode=codes[0].rawValue;document.getElementById('barcodeKode').textContent='EATWELL-OUTBOUND-001 (Scan: '+kode+') - 1 Barcode Untuk Semua Barang!';document.getElementById('scanInput').value='EATWELL-OUTBOUND-001';document.getElementById('scanStatus').textContent='✅ SCAN BERHASIL - 1 Barcode! Tinggal isi Barang, Dari Mana, Ke Mana, Siapa!';stream.getTracks().forEach(t=>t.stop());v.style.display='none';alert('✅ SCAN BERHASIL!\n\n1 Barcode EATWELL-OUTBOUND-001 untuk semua barang!\n\nTinggal isi:\n• Nama Barang Yang Dipinjam\n• Dari Mana → Ke Mana\n• Siapa Yang Pinjem\n• Tanda Tangan!\n\nLalu Kirim!');return}}catch(e){}if(v.style.display!=='none')requestAnimationFrame(loop)};loop()}else{document.getElementById('scanStatus').textContent='Kamera aktif! Ketik EATWELL-OUTBOUND-001 / Proses Scan!'}}catch(e){alert('❌ Kamera tidak bisa! Ketik EATWELL-OUTBOUND-001 manual aja!')}}
function prosesScan(){let v=document.getElementById('scanInput').value.trim().toUpperCase()||'EATWELL-OUTBOUND-001';let aksi=document.getElementById('aksiScan').value;document.getElementById('barcodeKode').textContent=v+' - 1 Barcode Untuk Semua Barang!';document.getElementById('pAksi').value=aksi;document.getElementById('scanInfo').textContent='✅ Scan '+v+' → Mode: '+aksi.toUpperCase()+' - Tinggal isi Nama Barang, Dari Mana → Ke Mana, Siapa Yang Pinjem, Tanda Tangan, Kirim!';alert('✅ Scan: '+v+' → '+aksi.toUpperCase()+'\n\nTinggal isi barangnya apa!')}
function hapus(i){let d=load();if(confirm('Hapus '+d.master[i].nama+'?')){d.master.splice(i,1);save(d);render()}}
function editSO(i,f,val){let d=load();d.master[i][f]=parseInt(val||0);save(d);render()}
function cepatAI(t){document.getElementById('aiInput').value=t;generateAI()}
function generateAI(){let q=document.getElementById('aiInput').value.trim()||'buatkan laporan';let d=load();let l=q.toLowerCase();let j='';let totIN=d.master.reduce((a,b)=>a+b.in,0),totOUT=d.master.reduce((a,b)=>a+b.out,0),totSO=d.master.reduce((a,b)=>a+b.so,0),totRet=d.master.reduce((a,b)=>a+b.retur,0),totPin=d.pinjam.filter(p=>p.status.includes('Dipinjam')).reduce((a,b)=>a+b.jumlah,0),totSisa=d.master.reduce((a,b)=>a+akhir(b),0);if(l.includes('masuk')){j=`📩 Barang Masuk Total: ${totIN}`}else if(l.includes('keluar')){j=`📤 Barang Keluar Total: ${totOUT}`}else if(l.includes('pinjam')){j=`🤝 Yang Pinjam Belum Balik: ${totPin}<br>`+d.pinjam.filter(p=>p.status.includes('Dipinjam')).map(p=>`• ${p.nama} ${p.jumlah} - ${p.peminjam} - Dari ${p.dari} → Ke ${p.ke} - TTD: ${p.namaTtdPeminjam} / ${p.namaTtdPenyerah} - ${p.setujuAtasan}`).join('<br>')}else if(l.includes('retur')){j=`↩️ Retur Total: ${totRet} - Sudah balik jadi Stok!`}else{j=`📄 LAPORAN OPERASIONAL OUTBOUND ${new Date().toLocaleDateString('id-ID')}<br>SO ${totSO} | IN ${totIN} | OUT ${totOUT} | Retur ${totRet} | Pinjam ${totPin} | <b>Sisa ${totSisa}</b>`}document.getElementById('aiHasil').innerHTML=j;document.getElementById('chatAI').innerHTML+=`<br><br><b>Kamu:</b> ${q}<br><b>AI:</b> ${j}`}
function render(){let d=load();let q=(document.getElementById('cari')?document.getElementById('cari').value||'':'').toLowerCase();let fb=document.getElementById('filterBrand')?document.getElementById('filterBrand').value:'';let f=d.master.filter(m=>(!q||m.nama.toLowerCase().includes(q)||m.brand.toLowerCase().includes(q))&&(!fb||m.brand===fb));if(document.getElementById('tb'))document.getElementById('tb').innerHTML=f.map(m=>{let idx=d.master.indexOf(m);return `<tr><td><span class="brandTag">${m.brand}</span></td><td>${m.cat}</td><td><b>${m.nama}</b></td><td>${m.uom}</td><td><input type="number" value="${m.so}" onchange="editSO(${idx},'so',this.value)"></td><td><input type="number" value="${m.in}" onchange="editSO(${idx},'in',this.value)"></td><td><input type="number" value="${m.out}" onchange="editSO(${idx},'out',this.value)"></td><td class="retur"><input type="number" value="${m.retur}" onchange="editSO(${idx},'retur',this.value)" style="background:transparent"></td><td class="${minus(m)<0?'minusCell':''}">${minus(m)<0?minus(m):0}</td><td><b>${akhir(m)}</b></td><td><button onclick="hapus(${idx})">🗑️</button></td></tr>`}).join('')||'<tr><td colspan=11>Belum ada barang - Klik Isi Contoh / Paste Excel!</td></tr>';let totSO=d.master.reduce((a,b)=>a+b.so,0),totIN=d.master.reduce((a,b)=>a+b.in,0),totOUT=d.master.reduce((a,b)=>a+b.out,0),totRet=d.master.reduce((a,b)=>a+b.retur,0),totPin=d.pinjam.filter(p=>p.status.includes('Dipinjam')).reduce((a,b)=>a+b.jumlah,0),totSisa=d.master.reduce((a,b)=>a+akhir(b),0),totMinus=d.master.filter(m=>minus(m)<0).length;if(document.getElementById('kSO')){document.getElementById('kSO').textContent=totSO;document.getElementById('kIN').textContent=totIN;document.getElementById('kOUT').textContent=totOUT;document.getElementById('kPinjam').textContent=totPin;document.getElementById('kAkhir').textContent=totSisa;document.getElementById('kRetur').textContent=totRet;document.getElementById('kMinus').textContent=totMinus;document.getElementById('kTotalItem').textContent=d.master.length;document.getElementById('kHariIni').textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'});let per={};d.master.forEach(m=>{per[m.brand]=(per[m.brand]||0)+akhir(m)});document.getElementById('akhirPerBrand').innerHTML=Object.entries(per).map(([k,v])=>k+': '+v).join(' • ');let pp={};d.pinjam.filter(p=>p.status.includes('Dipinjam')).forEach(p=>{pp[p.siapa]=(pp[p.siapa]||0)+p.jumlah});document.getElementById('pinjamPerBrand').innerHTML=Object.entries(pp).map(([k,v])=>k+': '+v).join(' • ')||'Tidak ada yang pinjam';document.getElementById('soPerBrand').innerHTML='Per Brand: '+Object.entries(d.master.reduce((o,m)=>{o[m.brand]=(o[m.brand]||0)+m.so;return o},{})).map(([k,v])=>k+': '+v).join(' • ');if(document.getElementById('notifTop'))document.getElementById('notifTop').textContent=d.pinjam.filter(p=>p.status.includes('Dipinjam')).length;if(document.getElementById('listIN'))document.getElementById('listIN').innerHTML=d.riwayat.filter(r=>r.tipe==='IN').slice(-20).reverse().map(r=>`• ${r.nama} +${r.jumlah} - ${r.waktu}<br>`).join('')||'Belum ada IN';if(document.getElementById('listOUT'))document.getElementById('listOUT').innerHTML=d.riwayat.filter(r=>r.tipe==='OUT').slice(-20).reverse().map(r=>`• ${r.nama} -${r.jumlah} - ${r.waktu}<br>`).join('')||'Belum ada OUT';if(document.getElementById('weeklyList'))document.getElementById('weeklyList').innerHTML=d.master.map(m=>`• ${m.nama} (${m.brand}) | SO ${m.so} | IN ${m.in} | OUT ${m.out} | Retur ${m.retur} | <b>Sisa ${akhir(m)}</b><br>`).join('');if(document.getElementById('bulananList'))document.getElementById('bulananList').innerHTML=document.getElementById('weeklyList').innerHTML;if(document.getElementById('periodeReport'))document.getElementById('periodeReport').textContent=new Date().toLocaleDateString('id-ID');if(document.getElementById('reportList'))document.getElementById('reportList').innerHTML=`<table><thead><tr><th>BRAND</th><th>TYPE</th><th>ITEM</th><th>SATUAN</th><th>SO</th><th>IN</th><th>OUT</th><th>RETUR</th><th>PINJAM</th><th>STOCK</th><th>TO ORDER</th></tr></thead><tbody>${d.master.map(m=>`<tr><td>${m.brand}</td><td>${m.cat}</td><td>${m.nama}</td><td>${m.uom}</td><td>${m.so}</td><td>${m.in}</td><td>${m.out}</td><td>${m.retur}</td><td>${dipinjamAktif(m.nama)}</td><td><b>${akhir(m)}</b></td><td>${akhir(m)<10?'ORDER '+(10-akhir(m)):0}</td></tr>`).join('')}</tbody></table>`;if(document.getElementById('tbPinjam'))document.getElementById('tbPinjam').innerHTML=d.pinjam.map(p=>`<tr><td><b>${p.nama}</b><br><small>${p.waktu}</small></td><td><b>${p.dari}</b> → <b>${p.ke}</b><br><small>${p.perlu}</small></td><td><b>${p.peminjam}</b><br><small>${p.siapa}</small></td><td>${p.jumlah}</td><td>${p.ttdPeminjam?`<img src="${p.ttdPeminjam}" style="width:60px;height:25px;border:1px solid #ddd">`: '❌ Belum'}<br><small>${p.namaTtdPeminjam||''}</small></td><td>${p.ttdPenyerah?`<img src="${p.ttdPenyerah}" style="width:60px;height:25px;border:1px solid #ddd">`: '❌ Belum'}<br><small>${p.namaTtdPenyerah||''}</small></td><td>${p.setujuAtasan||'⏳ Menunggu'}<br><small>${p.ttdAtasan||''}</small></td><td>${p.status}</td></tr>`).join('')||'<tr><td colspan=8>Belum ada pinjam</td></tr>';if(document.getElementById('listPinjam'))document.getElementById('listPinjam').innerHTML=d.pinjam.map((p,i)=>`<div style="border:1px solid #ddd;border-radius:10px;padding:10px;margin:6px 0;font-size:13px"><b>${p.nama}</b> - ${p.jumlah} - ${p.peminjam} (${p.siapa})<br><small>🕐 ${p.waktu}<br>Dari: <b>${p.dari}</b> → Ke: <b>${p.ke}</b><br>Penyerah: ${p.penyerah}<br>Keperluan: ${p.perlu}</small><br><b>TTD Peminjam:</b> ${p.ttdPeminjam?'✅ Ada - '+p.namaTtdPeminjam:'❌ Belum'} | <b>TTD Penyerah:</b> ${p.ttdPenyerah?'✅ Ada - '+p.namaTtdPenyerah:'❌ Belum'}<br><b>SETUJU ATASAN:</b> ${p.setujuAtasan}<br><b>${p.status}</b><br>${p.status.includes('Menunggu')?`<button class="green" onclick="setuju(${i})">✅ Setuju Atasan + TTD Atasan</button><button onclick="tolak(${i})">Tolak</button>`:''}${p.status.includes('Dipinjam')?`<button onclick="kembaliPinjam(${i})">✅ Sudah Dikembalikan</button>`:''}${p.status.includes('Disetujui')?`<button onclick="suratJalan(${i})">📄 Surat Jalan PDF - Ada 3 TTD!</button>`:''}</div>`).join('')||'Belum ada pinjam';if(document.getElementById('listRetur'))document.getElementById('listRetur').innerHTML=d.returList.map(r=>`• ${r.nama} +${r.jumlah} - ${r.siapa} - ${r.alasan} - ${r.waktu}<br>`).join('')||'Belum ada retur';if(document.getElementById('riwayatHarian'))document.getElementById('riwayatHarian').innerHTML=d.riwayat.slice(-30).reverse().map(r=>`• [${r.tipe}] ${r.nama} ${r.jumlah} - ${r.waktu}<br>`).join('')||'Belum ada riwayat';if(document.getElementById('statistikList'))document.getElementById('statistikList').innerHTML=`<b>Akumulasi:</b> SO ${totSO} | IN ${totIN} | OUT ${totOUT} | Retur ${totRet} | Pinjam ${totPin} | <b>Sisa ${totSisa}</b>`;let c=document.getElementById('chart');if(c){let x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);let vals=[totSO,totIN,totOUT,totRet,totPin];let labs=['SO','IN','OUT','RETUR','PINJAM'];let max=Math.max(...vals,1);vals.forEach((v,i)=>{x.fillStyle=['#111','#15803d','#ea580c','#e11d48','#0284c7'][i];x.fillRect(20+i*135,140-(v/max*100),100,v/max*100);x.fillStyle='#111';x.font='bold 12px Arial';x.fillText(labs[i]+': '+v,20+i*135,155)})}if(document.getElementById('aiRingkasan'))document.getElementById('aiRingkasan').innerHTML=`• Sisa Stok ${totSisa} - ${d.master.length} barang<br>• Masuk ${totIN} | Keluar ${totOUT} | Retur ${totRet} | Pinjam ${totPin}`}}
render();
</script></body></html>
